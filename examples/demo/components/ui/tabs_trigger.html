@props({'value': ''})
<button type="button" role="tab" data-slot="tabs-trigger"
  x-on:click="tab = '{{ value }}'"
  x-bind:aria-selected="tab === '{{ value }}'"
  x-bind:data-state="tab === '{{ value }}' ? 'active' : 'inactive'"
  {{ attributes.cn(
    "inline-flex h-[calc(100%-1px)] flex-1 cursor-pointer items-center justify-center gap-1.5 rounded-md border border-transparent px-2 py-1 text-sm font-medium whitespace-nowrap text-foreground transition-[color,box-shadow] focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50 focus-visible:outline-1 disabled:pointer-events-none disabled:opacity-50 dark:text-muted-foreground",
    "data-[state=active]:bg-background data-[state=active]:shadow-sm dark:data-[state=active]:border-input dark:data-[state=active]:bg-input/30 dark:data-[state=active]:text-foreground",
  ) }}>{{ slot }}</button>
