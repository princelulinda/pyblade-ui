<nav data-slot="navigation-menu" x-data="{ active: null, timer: null, show(v) { clearTimeout(this.timer); this.active = v }, hide() { this.timer = setTimeout(() => this.active = null, 150) } }"
  x-on:keydown.escape="active = null" x-on:click.outside="active = null" x-on:mouseleave="hide()"
  {{ attributes.cn("relative flex max-w-max flex-1 items-center justify-center") }}>{{ slot }}</nav>
