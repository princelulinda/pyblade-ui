@props({'variant': 'ghost', 'size': 'xs', 'type': 'button'})
<button type="{{ type }}" data-slot="input-group-button" {{ attributes.cn(
    "inline-flex shrink-0 cursor-pointer items-center justify-center gap-2 text-sm font-medium whitespace-nowrap shadow-none transition-all outline-none focus-visible:ring-[3px] focus-visible:ring-ring/50 disabled:pointer-events-none disabled:opacity-50 [&_svg]:pointer-events-none [&_svg]:shrink-0",
    {
        'ghost': 'hover:bg-accent hover:text-accent-foreground dark:hover:bg-accent/50',
        'secondary': 'bg-secondary text-secondary-foreground hover:bg-secondary/80',
        'default': 'bg-primary text-primary-foreground hover:bg-primary/90',
        'outline': 'border bg-background hover:bg-accent',
    }[variant],
    {
        'xs': "h-6 gap-1 rounded-[calc(var(--radius)-5px)] px-2 has-[>svg]:px-2 [&>svg:not([class*='size-'])]:size-3.5",
        'sm': 'h-8 gap-1.5 rounded-md px-2.5 has-[>svg]:px-2.5',
        'icon-xs': 'size-6 rounded-[calc(var(--radius)-5px)] p-0 has-[>svg]:p-0',
        'icon-sm': 'size-8 p-0 has-[>svg]:p-0',
    }[size],
) }}>{{ slot }}</button>
