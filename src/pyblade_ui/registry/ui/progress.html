@props({'value': 0})
<div role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{ value }}" data-slot="progress" {{ attributes.cn("relative h-2 w-full overflow-hidden rounded-full bg-primary/20") }}>
  <div class="h-full w-full flex-1 bg-primary transition-all" style="transform: translateX(-{{ 100 - min(max(int(value), 0), 100) }}%)"></div>
</div>
